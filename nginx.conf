# FAST-Assist Studio — nginx configuration
# Serves the Vite SPA with:
#   - HTML5 history API fallback (all routes → index.html)
#   - Long-term cache for hashed assets
#   - No-cache for index.html and mock JSON
#   - gzip compression
#   - Security headers

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────

    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Hashed static assets — cache 1 year ──────────────────────────────────
    # Vite outputs files like index-B6unDpV.js — the hash changes on rebuild.

    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Videos — cache 7 days ────────────────────────────────────────────────

    location ~* \.(mp4|webm|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Mock JSON — no cache (operators may update scenarios) ────────────────

    location /mock/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── index.html — no cache ────────────────────────────────────────────────

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA fallback — all non-file routes → index.html ──────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ────────────────────────────────────────────────────

    location ~ /\. {
        deny all;
    }
}
