steps:
  # Build the Docker image (no cache)
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - --no-cache
      - --progress=plain
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:$COMMIT_SHA
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:latest
      - .

  # Push commit-tagged image
  - name: gcr.io/cloud-builders/docker
    id: Push Commit
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:$COMMIT_SHA

  # Push latest tag
  - name: gcr.io/cloud-builders/docker
    id: Push Latest
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:latest

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - fast-assist-studio
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:$COMMIT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --update-secrets=OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:$COMMIT_SHA
  - asia-south1-docker.pkg.dev/$PROJECT_ID/fastassist/fast-assist-studio:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
