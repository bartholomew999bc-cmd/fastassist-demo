# FAST-Assist Studio — nginx configuration template
#
# ${PORT} is substituted at container startup by docker-entrypoint.sh.
# Cloud Run sets $PORT at runtime (default: 8080).
#
# Serves the Vite SPA with:
#   - HTML5 History API fallback  (all routes → index.html)
#   - Long-term cache for hashed assets
#   - No-cache for index.html
#   - gzip compression
#   - Security headers
#   - Health check endpoint
#   - /api/inference proxied to the local Node.js inference server (port 9001)

# ── Inference proxy upstream ─────────────────────────────────────────────────
# The Node.js server (api/server.ts, bundled to dist-proxy.cjs) listens on
# 127.0.0.1:9001 and injects the server-side OPENROUTER_API_KEY.
upstream inference_proxy {
    server 127.0.0.1:9001;
    keepalive 4;
}

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Health check ─────────────────────────────────────────────────────────
    # Cloud Run calls GET / for liveness; expose a lightweight dedicated path.

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── Inference proxy ───────────────────────────────────────────────────────
    # Forward all /api/inference requests to the local Node.js proxy server.
    # The proxy injects OPENROUTER_API_KEY — the key never reaches the browser.

    location = /api/inference {
        proxy_pass         http://inference_proxy/api/inference;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Inference calls can take up to 25 s — allow adequate timeouts.
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_connect_timeout 5s;
    }

    # ── Compression ──────────────────────────────────────────────────────────

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ── Security headers ─────────────────────────────────────────────────────

    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-Frame-Options          "SAMEORIGIN"        always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # Permit Firebase Auth popup and iframe flows.
    # Tighten this once you know the exact origins in production.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # ── Hashed static assets — cache 1 year ──────────────────────────────────
    # Vite outputs files like index-B6unDpV.js — the hash changes on rebuild.

    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Videos — cache 7 days ────────────────────────────────────────────────

    location ~* \.(mp4|webm|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Mock JSON — no cache (operators may update scenarios) ────────────────

    location /mock/ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── index.html — no cache ────────────────────────────────────────────────

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── SPA fallback — all non-file routes → index.html ──────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Deny hidden files ────────────────────────────────────────────────────

    location ~ /\. {
        deny all;
    }
}
